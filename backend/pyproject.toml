[project]
name = "nytka-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi[standard]>=0.139.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "instructor>=1.15.4",
    "litellm>=1.92.0",
    "orjson>=3.11.9",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
]

[project.optional-dependencies]
diarization = ["sherpa-onnx>=1.10"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
# `manual` tests need a live LLM (LM Studio) — run them explicitly with `-m manual`.
markers = [
    "real_brief: run the real brief-generation step instead of the offline stub",
    "real_dedup: run the real duplicate-flagging step instead of the offline stub",
    "manual: needs a live LLM; excluded from the default run and CI",
]
addopts = "-m 'not manual'"
